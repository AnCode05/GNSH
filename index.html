<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Hóa Học - Từng câu</title>
<style>
:root {
    --bg: #f4f7fc; --card-bg: #ffffff; --text: #1e2a3a; --text-muted: #5a6e85;
    --border: #d0dae8; --primary: #2563eb; --primary-hover: #1d4ed8;
    --success: #16a34a; --success-bg: #e6f7ec; --danger: #dc2626; --danger-bg: #fde8e8;
    --hint-bg: #fef9e7; --hint-border: #f0d98c; --shadow: 0 4px 16px rgba(0,0,0,0.06);
    --radius: 12px; --table-header: #eef2f9;
}
[data-theme="dark"] {
    --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --text-muted: #94a3b8;
    --border: #334155; --primary: #3b82f6; --primary-hover: #60a5fa;
    --success: #22c55e; --success-bg: #143d2a; --danger: #ef4444; --danger-bg: #4a1d1d;
    --hint-bg: #2d2a1a; --hint-border: #6b5d1e; --shadow: 0 4px 16px rgba(0,0,0,0.4);
    --table-header: #1a2537;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background .3s, color .3s; padding: 16px;
}
.container { max-width: 900px; margin: 0 auto; }

/* Header */
header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 12px; padding: 16px 20px; background: var(--card-bg);
    border-radius: var(--radius); box-shadow: var(--shadow);
    margin-bottom: 20px; border: 1px solid var(--border);
}
header h1 { font-size: 1.3rem; font-weight: 700; }
.status-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: .9rem; }
.status-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px;
    border-radius: 20px; background: var(--bg); border: 1px solid var(--border);
}
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.green { background: var(--success); } .dot.red { background: var(--danger); }
.dot.gray { background: var(--text-muted); }
.theme-toggle {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: .9rem;
    display: flex; align-items: center; gap: 6px; transition: all .2s;
}
.theme-toggle:hover { border-color: var(--primary); }

/* Progress */
.progress-wrap {
    width: 100%; height: 8px; background: var(--border); border-radius: 4px;
    margin-bottom: 20px; overflow: hidden;
}
.progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--primary), #7c3aed);
    width: 0%; transition: width .3s; border-radius: 4px;
}
.progress-text { text-align: center; font-size: .85rem; color: var(--text-muted); margin-bottom: 14px; }

/* Question Card */
.question-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
    margin-bottom: 18px; animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.q-number { font-weight: 700; color: var(--primary); font-size: .95rem; white-space: nowrap; }
.q-text { font-weight: 600; font-size: 1.05rem; flex: 1; }
.hint-btn {
    background: none; border: 1px solid var(--hint-border); color: var(--text-muted);
    padding: 4px 10px; border-radius: 16px; cursor: pointer; font-size: .8rem;
    white-space: nowrap; transition: all .2s;
}
.hint-btn:hover { background: var(--hint-bg); color: var(--text); }
.hint-box {
    display: none; background: var(--hint-bg); border: 1px solid var(--hint-border);
    border-radius: 8px; padding: 10px 14px; margin: 10px 0 4px; font-size: .9rem;
}
.hint-box.show { display: block; }

.options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.option {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px; cursor: pointer;
    transition: all .2s; background: var(--bg);
}
.option:hover:not(.disabled) { border-color: var(--primary); }
.option.selected { border-color: var(--primary); background: rgba(37,99,235,0.08); }
.option.correct-answer { border-color: var(--success); background: var(--success-bg); }
.option.wrong-answer { border-color: var(--danger); background: var(--danger-bg); }
.option.disabled { cursor: default; }
.opt-label { font-weight: 700; min-width: 22px; color: var(--primary); }
.opt-text { flex: 1; }

/* Feedback */
.feedback-box {
    margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-size: .95rem;
    display: none; animation: fadeIn .3s ease;
}
.feedback-box.show { display: block; }
.feedback-box.correct { background: var(--success-bg); border: 1px solid var(--success); }
.feedback-box.wrong { background: var(--danger-bg); border: 1px solid var(--danger); }
.feedback-title { font-weight: 700; margin-bottom: 6px; font-size: 1rem; }
.feedback-title.correct { color: var(--success); }
.feedback-title.wrong { color: var(--danger); }
.feedback-explain { color: var(--text); font-size: .92rem; }

/* Buttons */
.btn {
    padding: 12px 28px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: all .2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }

/* True/False Table */
.tf-section {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
    margin-top: 24px;
}
.tf-section h2 { font-size: 1.2rem; margin-bottom: 8px; }
.tf-section p.intro { color: var(--text-muted); font-size: .9rem; margin-bottom: 14px; }
.tf-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tf-table th, .tf-table td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
.tf-table th { background: var(--table-header); font-weight: 700; text-align: center; }
.tf-table td:first-child { width: 60%; }
.tf-table td:nth-child(2), .tf-table td:nth-child(3) { text-align: center; width: 20%; }
.tf-table input[type="radio"] { accent-color: var(--primary); transform: scale(1.2); cursor: pointer; }
.tf-table tr.correct-row { background: var(--success-bg); }
.tf-table tr.wrong-row { background: var(--danger-bg); }
.tf-feedback { font-size: .85rem; margin-top: 4px; font-weight: 600; }
.tf-feedback.correct { color: var(--success); }
.tf-feedback.wrong { color: var(--danger); }

/* Result banner */
.result-banner {
    display: none; text-align: center; padding: 18px; border-radius: var(--radius);
    margin-bottom: 20px; font-size: 1.05rem; font-weight: 600;
    border: 1px solid var(--border); background: var(--card-bg);
}
.result-banner.show { display: block; }

.hidden { display: none !important; }

@media (max-width: 640px) {
    header { flex-direction: column; align-items: stretch; }
    .status-bar { justify-content: center; }
    .tf-table { font-size: .82rem; }
    .tf-table th, .tf-table td { padding: 8px 5px; }
}
</style>
</head>
<body data-theme="light">
<div class="container">
    <header>
        <h1>🧪 Quiz Hóa Học</h1>
        <div class="status-bar">
            <div class="status-item"><span class="dot green"></span> Đúng: <strong id="correctCount">0</strong></div>
            <div class="status-item"><span class="dot red"></span> Sai: <strong id="wrongCount">0</strong></div>
            <div class="status-item"><span class="dot gray"></span> Đã làm: <strong id="doneCount">0</strong></div>
            <button class="theme-toggle" id="themeToggle">🌙 Tối</button>
        </div>
    </header>

    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Câu 1 / 50</div>

    <div class="result-banner" id="resultBanner"></div>

    <!-- Phần trắc nghiệm từng câu -->
    <div id="singleQuestionContainer"></div>

    <!-- Phần Đúng/Sai (hiển thị sau khi xong 50 câu) -->
    <div class="tf-section hidden" id="tfSection">
        <h2>📋 Phần II: Trắc nghiệm Đúng/Sai</h2>
        <p class="intro">Chọn <strong>Đúng</strong> hoặc <strong>Sai</strong> cho mỗi phát biểu. Kết quả hiển thị sau khi bấm "Nộp bài".</p>
        <table class="tf-table">
            <thead><tr><th>Câu hỏi / Phát biểu</th><th>Đúng</th><th>Sai</th></tr></thead>
            <tbody id="tfBody"></tbody>
        </table>
        <div class="actions">
            <button class="btn btn-primary" id="submitTF">✅ Nộp bài Đúng/Sai</button>
        </div>
    </div>

    <div class="actions" id="mainActions">
        <button class="btn btn-outline" id="resetBtn">🔄 Làm lại (xáo trộn)</button>
    </div>
</div>

<script>
// ==================== DỮ LIỆU 50 CÂU TRẮC NGHIỆM ====================
const questionsData = [
{id:1,text:"Mối quan hệ giữa tốc độ phản ứng thuận (v_t) và tốc độ phản ứng nghịch (v_n) ở trạng thái cân bằng được biểu diễn như thế nào?",options:["v_t = 2v_n","v_t = v_n ≠ 0","v_t = 0,5v_n","v_t = v_n = 0 (hoặc v_t = v_n)"],correct:1,hint:"Ở trạng thái cân bằng, tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch nhưng cả hai vẫn tiếp tục diễn ra, không dừng lại."},
{id:2,text:"Điền từ hoặc cụm từ thích hợp vào dấu “...” trong câu sau: “Cân bằng hóa học là trạng thái của phản ứng thuận nghịch khi tốc độ phản ứng thuận ... tốc độ phản ứng nghịch”.",options:["lớn hơn","bằng","nhỏ hơn","khác"],correct:1,hint:"Cân bằng hóa học đạt được khi tốc độ phản ứng thuận bằng tốc độ phản ứng nghịch."},
{id:3,text:"Yếu tố nào sau đây không làm dịch chuyển cân bằng của hệ phản ứng?",options:["Nhiệt độ","Áp suất","Nồng độ","Chất xúc tác"],correct:3,hint:"Chất xúc tác làm tăng tốc độ cả phản ứng thuận và nghịch như nhau, không làm dịch chuyển cân bằng."},
{id:4,text:"Các yếu tố ảnh hưởng đến cân bằng hoá học là:",options:["nồng độ, nhiệt độ và chất xúc tác","nồng độ, áp suất và diện tích bề mặt","nồng độ, nhiệt độ và áp suất","áp suất, nhiệt độ và chất xúc tác"],correct:2,hint:"Ba yếu tố ảnh hưởng đến cân bằng hóa học là nồng độ, nhiệt độ và áp suất (theo nguyên lý Le Chatelier)."},
{id:5,text:"Trong khí quyển Trái Đất, nguyên tố nitrogen tồn tại chủ yếu dưới dạng nào?",options:["NO","N₂","N₂O","NH₃"],correct:1,hint:"Nitrogen trong khí quyển chủ yếu tồn tại dưới dạng phân tử N₂ (khí nitơ)."},
{id:6,text:"Trong khí quyển trái đất, nitrogen chiếm bao nhiêu phần trăm thể tích khí quyển?",options:["15%","78,1%","80%","21%"],correct:1,hint:"Nitrogen chiếm khoảng 78,1% thể tích không khí, oxygen chiếm khoảng 21%."},
{id:7,text:"Oxide được điều chế trực tiếp từ phản ứng của nitrogen với oxygen là",options:["NO₂","NO","N₂O","N₂O₅"],correct:1,hint:"Ở nhiệt độ cao (tia lửa điện), N₂ phản ứng với O₂ tạo thành NO."},
{id:8,text:"Khi có sấm chớp, khí quyển sinh ra khí",options:["CO","NO","SO₂","CO₂"],correct:1,hint:"Sấm chớp cung cấp năng lượng để N₂ phản ứng với O₂ tạo NO."},
{id:9,text:"Khi rút xăng, dầu ra khỏi các bồn chứa, người ta thường bơm khí nitrogen để thay thế hoàn toàn hoặc một phần không khí làm giảm nồng độ oxygen để giảm nguy cơ cháy nổ. Tính chất nào sau đây của nitrogen được sử dụng trong trường hợp trên?",options:["Nitrogen chiếm 78,1% thể tích không khí","Nitrogen có tính oxi hóa mạnh ở điều kiện thường","Nitrogen tác dụng được với oxygen ở nhiệt độ thường","Nitrogen trơ về mặt hóa học ở nhiệt độ thường"],correct:3,hint:"Nitrogen trơ ở nhiệt độ thường nên được dùng để tạo môi trường trơ, giảm nguy cơ cháy nổ."},
{id:10,text:"Cho cân bằng hoá học: H₂(g) + I₂(g) ⇌ 2HI(g); ΔᵣH°₂₉₈ > 0. Cân bằng không bị chuyển dịch khi",options:["tăng nhiệt độ của hệ","giảm nồng độ HI","tăng nồng độ H₂","giảm áp suất chung của hệ"],correct:3,hint:"Phản ứng có số mol khí hai vế bằng nhau (1+1=2), nên áp suất không ảnh hưởng đến cân bằng."},
{id:11,text:"Trong những điều kiện khẳng định dưới đây, điều nào không phù hợp với một hệ hoá học đang ở trạng thái cân bằng?",options:["Phản ứng thuận và nghịch vẫn tiếp tục diễn ra","Nồng độ của các sản phẩm và chất phản ứng không đổi","Tốc độ phản ứng thuận và phản ứng nghịch bằng nhau","Nồng độ của các sản phẩm và chất phản ứng bằng nhau"],correct:3,hint:"Ở cân bằng, nồng độ các chất không đổi nhưng không nhất thiết phải bằng nhau."},
{id:12,text:"Trong các phát biểu sau, phát biểu nào đúng khi một hệ ở trạng thái cân bằng?",options:["Phản ứng thuận đã dừng","Phản ứng nghịch đã dừng","Nồng độ chất tham gia và sản phẩm bằng nhau","Nồng độ của các chất trong hệ không đổi"],correct:3,hint:"Ở trạng thái cân bằng, nồng độ các chất không thay đổi theo thời gian."},
{id:13,text:"Cho cân bằng (trong bình kín): CO(g) + H₂O(g) ⇌ CO₂(g) + H₂(g); ΔᵣH°₂₉₈ < 0. Các yếu tố: (1) tăng nhiệt độ; (2) thêm hơi nước; (3) thêm H₂; (4) tăng áp suất chung; (5) dùng xúc tác. Dãy gồm các yếu tố đều làm thay đổi cân bằng là",options:["(1), (4), (5)","(1), (2), (3)","(2), (3), (4)","(1), (2), (4)"],correct:1,hint:"Xúc tác (5) không dịch chuyển cân bằng; áp suất (4) không ảnh hưởng vì số mol khí hai vế bằng nhau. Vậy (1),(2),(3)."},
{id:14,text:"Cho phản ứng thuận nghịch: 2SO₂(g) + O₂(g) ⇌ 2SO₃(g). Biểu thức hằng số cân bằng là",options:["K_c = [SO₃]² / ([SO₂]² · [O₂])","K_c = [SO₃] / ([SO₂] · [O₂])","K_c = ([SO₂]² · [O₂]) / [SO₃]²","K_c = ([SO₂] · [O₂]) / [SO₃]"],correct:0,hint:"K_c = [SO₃]² / ([SO₂]² · [O₂])."},
{id:15,text:"Khi tăng áp suất, cân bằng nào chuyển dịch theo chiều thuận? (1) 2SO₂(g)+O₂(g)⇌2SO₃(g); (2) NH₄Cl(s)⇌NH₃(g)+HCl(g); (3) 2H₂O₂(aq)⇌2H₂O(l)+O₂(g); (4) 3O₂(g)⇌2O₃(g)",options:["(1) và (4)","(1) và (2)","(2) và (3)","Chỉ có (4)"],correct:0,hint:"Tăng áp suất dịch chuyển về phía ít phân tử khí hơn. (1): 3→2; (4): 3→2 → thuận."},
{id:16,text:"Ở một nhiệt độ nhất định, phản ứng N₂ + 3H₂ ⇌ 2NH₃ đạt cân bằng khi [N₂]=0,01M, [H₂]=2,0M, [NH₃]=0,4M. Hằng số cân bằng là",options:["2,6","2,2","0,21","2,0"],correct:3,hint:"K_c = (0,4)² / (0,01 · 2³) = 0,16 / 0,08 = 2,0."},
{id:17,text:"Môi trường acid là môi trường có",options:["[H⁺] < [OH⁻]","[H⁺] > [OH⁻]","[H⁺] = [OH⁻]","[H⁺] < 1,0·10⁻⁷"],correct:1,hint:"Trong môi trường acid, [H⁺] > [OH⁻]."},
{id:18,text:"Trong các dung dịch cùng nồng độ 0,1M, dung dịch nào có pH nhỏ nhất?",options:["NaOH","HCl","H₂SO₄","Ba(OH)₂"],correct:2,hint:"H₂SO₄ phân li cho 2 H⁺ → pH nhỏ nhất."},
{id:19,text:"Cho 10,0 mL NaOH 0,1M vào 15,0 mL HCl 0,1M. Dung dịch tạo thành làm",options:["phenolphthalein không màu chuyển đỏ","giấy quỳ tím hóa đỏ","giấy quỳ tím hóa xanh","giấy quỳ tím không chuyển màu"],correct:1,hint:"n(NaOH)=0,001; n(HCl)=0,0015 → HCl dư → quỳ hóa đỏ."},
{id:20,text:"Chất nào sau đây thuộc loại chất điện li mạnh?",options:["HNO₃","Mg(OH)₂","H₂S","HClO"],correct:0,hint:"HNO₃ là acid mạnh → điện li mạnh."},
{id:21,text:"Chất nào sau đây thuộc loại chất điện li mạnh?",options:["H₃PO₄","Na₃PO₄","H₂CO₃","Fe(OH)₃"],correct:1,hint:"Na₃PO₄ là muối tan, phân li hoàn toàn → điện li mạnh."},
{id:22,text:"Nước đóng vai trò base theo Brønsted–Lowry trong phản ứng nào?",options:["CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻","S²⁻ + H₂O ⇌ HS⁻ + OH⁻","HCO₃⁻ + H₂O ⇌ CO₃²⁻ + H₃O⁺","CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻"],correct:2,hint:"Ở phản ứng C, HCO₃⁻ nhường H⁺ cho H₂O → H₂O nhận H⁺ → base."},
{id:23,text:"Nước đóng vai trò acid theo Brønsted–Lowry trong phản ứng nào?",options:["Fe³⁺ + H₂O ⇌ Fe(OH)²⁺ + H⁺","Al³⁺ + 3H₂O ⇌ Al(OH)₃ + 3H⁺","NH₃ + H₂O ⇌ NH₄⁺ + OH⁻","NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺"],correct:2,hint:"Ở phản ứng C, H₂O nhường H⁺ cho NH₃ → nước là acid."},
{id:24,text:"Nhận xét nào sau đây đúng?",options:["Nitrogen không duy trì sự cháy, sự hô hấp và là khí độc","Vì có liên kết 3 nên phân tử nitrogen rất bền và ở nhiệt độ thường khá trơ","Khi tác dụng với kim loại hoạt động, nitrogen thể hiện tính khử","Số oxi hóa của N trong AlN, N₂O₄, NH₄⁺, NO₃⁻, NO₂⁻ lần lượt là -3,+4,-3,+5,+4"],correct:1,hint:"N₂ có liên kết ba bền vững nên ở nhiệt độ thường khá trơ."},
{id:25,text:"Liên kết hoá học trong phân tử NH₃ là liên kết",options:["cộng hoá trị có cực","ion","cộng hoá trị không cực","kim loại"],correct:0,hint:"N và H có độ âm điện khác nhau → cộng hóa trị có cực."},

// ==================== DỮ LIỆU ĐÚNG/SAI ====================
const tfData = [
{
    id: "tf1",
    context: "Xét cân bằng: 2NO₂(g) ⇌ N₂O₄(g) (NO₂ màu nâu đỏ, N₂O₄ không màu)",
    statements: [
        { text: "Khi đạt đến trạng thái cân bằng hóa học, phản ứng dừng lại.", correct: false },
        { text: "Luôn tồn tại đồng thời NO₂ và N₂O₄.", correct: true },
        { text: "Màu nhạt của hỗn hợp không thay đổi nếu giữ nguyên các điều kiện bên ngoài.", correct: true },
        { text: "Ở trạng thái cân bằng nồng độ các chất NO₂ và N₂O₄ trong hỗn hợp không thay đổi theo thời gian.", correct: true }
    ]
},
{
    id: "tf2",
    context: "Trong công nghiệp, amonia được tổng hợp theo phản ứng: 3H₂(g) + N₂(g) ⇌ 2NH₃(g) ΔᵣH°₂₉₈ = -91,8 kJ",
    statements: [
        { text: "Phản ứng tổng hợp NH₃ là phản ứng thu nhiệt.", correct: false },
        { text: "Khi thêm chất xúc tác, hằng số cân bằng K_c tăng.", correct: false },
        { text: "Khi tăng áp suất thì cân bằng chuyển dịch theo chiều thuận.", correct: true },
        { text: "Để tăng hiệu suất phản ứng, cần tăng nồng độ của H₂, N₂ và giảm nồng độ của NH₃.", correct: true }
    ]
}
];

// ==================== STATE ====================
let state = {
    questions: [],       // shuffled questions
    currentIndex: 0,     // câu hiện tại (0..49)
    answers: {},         // qid -> { selected, correct }
    correctCount: 0,
    wrongCount: 0,
    phase: "mc",         // "mc" | "tf" | "done"
    tfAnswers: {},
    tfSubmitted: false
};

// ==================== HELPERS ====================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ==================== RENDER 1 CÂU ====================
function renderCurrentQuestion() {
    const container = document.getElementById("singleQuestionContainer");
    const q = state.questions[state.currentIndex];
    const total = state.questions.length;
    const idx = state.currentIndex;

    document.getElementById("progressText").textContent = `Câu ${idx + 1} / ${total}`;
    document.getElementById("progressFill").style.width = ((idx) / total * 100) + "%";

    const answered = state.answers[q.id];
    const isAnswered = answered !== undefined;

    container.innerHTML = `
        <div class="question-card" id="currentCard">
            <div class="q-header">
                <span class="q-number">Câu ${idx + 1}</span>
                <span class="q-text">${escapeHtml(q.text)}</span>
                <button class="hint-btn" id="hintBtn">💡 Gợi ý</button>
            </div>
            <div class="hint-box" id="hintBox">${escapeHtml(q.hint)}</div>
            <div class="options" id="optionsWrap">
                ${q.options.map((opt, i) => {
                    let cls = "option";
                    if (isAnswered) {
                        cls += " disabled";
                        if (i === q.correct) cls += " correct-answer";
                        else if (i === answered.selected) cls += " wrong-answer";
                    }
                    return `
                        <div class="${cls}" data-opt="${i}">
                            <span class="opt-label">${String.fromCharCode(65 + i)}.</span>
                            <span class="opt-text">${escapeHtml(opt)}</span>
                        </div>`;
                }).join("")}
            </div>
            <div class="feedback-box ${isAnswered ? 'show' : ''} ${isAnswered ? (answered.correct ? 'correct' : 'wrong') : ''}" id="feedbackBox">
                ${isAnswered ? `
                    <div class="feedback-title ${answered.correct ? 'correct' : 'wrong'}">
                        ${answered.correct ? '✅ Chính xác!' : '❌ Sai rồi!'}
                    </div>
                    <div class="feedback-explain">
                        <strong>Đáp án đúng:</strong> ${String.fromCharCode(65 + q.correct)}. ${escapeHtml(q.options[q.correct])}<br>
                        <strong>Giải thích:</strong> ${escapeHtml(q.hint)}
                    </div>
                ` : ''}
            </div>
        </div>
        <div class="actions">
            ${isAnswered && idx < total - 1 ? `<button class="btn btn-primary" id="nextBtn">Tiếp theo →</button>` : ''}
            ${isAnswered && idx === total - 1 ? `<button class="btn btn-primary" id="toTFBtn">Chuyển sang phần Đúng/Sai →</button>` : ''}
        </div>
    `;

    // Hint toggle
    document.getElementById("hintBtn").addEventListener("click", () => {
        document.getElementById("hintBox").classList.toggle("show");
    });

    // Option click
    if (!isAnswered) {
        container.querySelectorAll(".option").forEach(optEl => {
            optEl.addEventListener("click", () => {
                const optIdx = parseInt(optEl.dataset.opt);
                handleAnswer(q, optIdx);
            });
        });
    }

    // Next button
    const nextBtn = document.getElementById("nextBtn");
    if (nextBtn) {
        nextBtn.addEventListener("click", () => {
            state.currentIndex++;
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }

    const toTFBtn = document.getElementById("toTFBtn");
    if (toTFBtn) {
        toTFBtn.addEventListener("click", () => {
            state.phase = "tf";
            document.getElementById("singleQuestionContainer").innerHTML = "";
            document.getElementById("progressText").textContent = "Hoàn thành phần trắc nghiệm!";
            document.getElementById("progressFill").style.width = "100%";
            document.getElementById("tfSection").classList.remove("hidden");
            renderTF();
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }

    updateStatus();
}

// ==================== XỬ LÝ CHỌN ĐÁP ÁN ====================
function handleAnswer(q, optIdx) {
    const isCorrect = optIdx === q.correct;
    state.answers[q.id] = { selected: optIdx, correct: isCorrect };
    if (isCorrect) state.correctCount++;
    else state.wrongCount++;

    // Re-render câu hiện tại để hiện feedback + nút Tiếp theo
    renderCurrentQuestion();
}

// ==================== STATUS ====================
function updateStatus() {
    document.getElementById("correctCount").textContent = state.correctCount;
    document.getElementById("wrongCount").textContent = state.wrongCount;
    document.getElementById("doneCount").textContent = state.currentIndex + (state.answers[state.questions[state.currentIndex]?.id] !== undefined ? 1 : 0);
}

// ==================== RENDER TRUE/FALSE ====================
function renderTF() {
    const tbody = document.getElementById("tfBody");
    tbody.innerHTML = "";

    tfData.forEach(tf => {
        const ctxRow = document.createElement("tr");
        ctxRow.innerHTML = `<td colspan="3" style="background:var(--table-header); font-weight:600; font-style:italic;">${escapeHtml(tf.context)}</td>`;
        tbody.appendChild(ctxRow);

        tf.statements.forEach((stmt, sIdx) => {
            const key = `${tf.id}-${sIdx}`;
            const val = state.tfAnswers[key];
            const tr = document.createElement("tr");
            tr.id = `tf-row-${key}`;
            tr.innerHTML = `
                <td>${escapeHtml(stmt.text)}</td>
                <td><input type="radio" name="tf-${key}" value="true" ${val === true ? 'checked' : ''} ${state.tfSubmitted ? 'disabled' : ''}></td>
                <td><input type="radio" name="tf-${key}" value="false" ${val === false ? 'checked' : ''} ${state.tfSubmitted ? 'disabled' : ''}></td>
            `;
            tbody.appendChild(tr);

            if (!state.tfSubmitted) {
                tr.querySelectorAll("input[type=radio]").forEach(inp => {
                    inp.addEventListener("change", () => {
                        state.tfAnswers[key] = inp.value === "true";
                    });
                });
            }
        });
    });

    const submitBtn = document.getElementById("submitTF");
    if (state.tfSubmitted) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Đã nộp";
    } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "✅ Nộp bài Đúng/Sai";
    }
}

// ==================== SUBMIT TF ====================
function submitTF() {
    if (state.tfSubmitted) return;
    state.tfSubmitted = true;
    state.phase = "done";

    let tfCorrect = 0, tfWrong = 0, tfTotal = 0;

    tfData.forEach(tf => {
        tf.statements.forEach((stmt, sIdx) => {
            tfTotal++;
            const key = `${tf.id}-${sIdx}`;
            const val = state.tfAnswers[key];
            const isCorrect = val === stmt.correct;
            if (isCorrect) tfCorrect++; else tfWrong++;

            const row = document.getElementById(`tf-row-${key}`);
            row.classList.add(isCorrect ? "correct-row" : "wrong-row");

            // Hiển thị feedback nếu sai
            if (!isCorrect) {
                const td = row.querySelector("td:first-child");
                const fb = document.createElement("div");
                fb.className = "tf-feedback wrong";
                fb.textContent = `→ Đáp án đúng: ${stmt.correct ? "Đúng" : "Sai"}`;
                td.appendChild(fb);
            }

            row.querySelectorAll("input").forEach(inp => inp.disabled = true);
        });
    });

    // Cộng vào tổng
    state.correctCount += tfCorrect;
    state.wrongCount += tfWrong;
    document.getElementById("correctCount").textContent = state.correctCount;
    document.getElementById("wrongCount").textContent = state.wrongCount;

    const total = state.correctCount + state.wrongCount;
    const pct = ((state.correctCount / total) * 100).toFixed(1);

    const banner = document.getElementById("resultBanner");
    banner.className = "result-banner show";
    banner.innerHTML = `🎯 Kết quả cuối: <strong>${state.correctCount}/${total}</strong> câu đúng (${pct}%) — Sai: <strong>${state.wrongCount}</strong> câu`;
    banner.scrollIntoView({ behavior: "smooth", block: "center" });

    renderTF();
}

// ==================== RESET ====================
function resetQuiz() {
    state = {
        questions: shuffleArray(questionsData),
        currentIndex: 0,
        answers: {},
        correctCount: 0,
        wrongCount: 0,
        phase: "mc",
        tfAnswers: {},
        tfSubmitted: false
    };

    document.getElementById("tfSection").classList.add("hidden");
    document.getElementById("resultBanner").className = "result-banner";
    document.getElementById("resultBanner").innerHTML = "";
    document.getElementById("progressFill").style.width = "0%";

    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// ==================== THEME ====================
function initTheme() {
    const btn = document.getElementById("themeToggle");
    const saved = localStorage.getItem("quiz-theme") || "light";
    document.body.setAttribute("data-theme", saved);
    btn.textContent = saved === "dark" ? "☀️ Sáng" : "🌙 Tối";

    btn.addEventListener("click", () => {
        const cur = document.body.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.body.setAttribute("data-theme", next);
        localStorage.setItem("quiz-theme", next);
        btn.textContent = next === "dark" ? "☀️ Sáng" : "🌙 Tối";
    });
}

// ==================== INIT ====================
document.addEventListener("DOMContentLoaded", () => {
    initTheme();
    resetQuiz();

    document.getElementById("resetBtn").addEventListener("click", resetQuiz);
    document.getElementById("submitTF").addEventListener("click", submitTF);
});
</script>
